button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}

nav.tabs button[aria-current="page"]{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.banner{margin:12px 0 0;padding:10px 14px;border-left:4px solid var(--miss);background:var(--surface);font-size:14px}

/* year strip: the signature element */
.strip{--c:15px;position:relative;margin:18px 0 6px;overflow-x:auto;padding-bottom:6px}
.strip-inner{display:inline-grid;grid-auto-flow:column;grid-template-rows:16px repeat(7,var(--c));gap:4px;min-width:max-content}
.strip .mlabel{font-size:11px;color:var(--ink-3);white-space:nowrap;grid-row:1}
.cell{width:var(--c);height:var(--c);border-radius:2px;border:0;padding:0;cursor:pointer;background:var(--future)}
.cell.blank{visibility:hidden;cursor:default}
.cell.ontime{background:var(--ok)}
.cell.late{background:var(--late)}
.cell.missed{background:var(--miss)}
.cell.partial{background:repeating-linear-gradient(45deg,var(--miss) 0 2px,var(--future) 2px 4px)}
.cell.progress,.cell.open{background:var(--future);box-shadow:inset 0 0 0 2px var(--hl)}
.cell.progress{background:linear-gradient(var(--hl),var(--hl)) bottom/100% 45% no-repeat,var(--future)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.cell.sel{transform:scale(1.25)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:18px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
@media (max-width:600px){.clock{text-align:left}.strip{--c:13px}}
.dayhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}

.dayhead .meta{color:var(--ink-2);margin-top:6px;font-size:14px}
.navbtns{display:flex;gap:6px}
.btn{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:6px 12px;cursor:pointer}

.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--miss);border-color:var(--miss)}

.todo input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ok);cursor:pointer}

.todo .tt{font-weight:600;line-height:1.4}
.todo.done .tt{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-2)}
.todo .opt{font-weight:400;font-size:12.5px;color:var(--ink-3);margin-left:6px}

.stats span:nth-child(even){text-align:right;font-weight:600}
.bar{height:6px;background:var(--future);border-radius:3px;overflow:hidden;margin:6px 0 2px}
.bar>i{display:block;height:100%;background:var(--ok)}
.muted{color:var(--ink-3);font-size:13px}

.goal{padding:18px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:44px 1fr;gap:14px}
.goal .num{font-family:var(--serif);font-size:34px;line-height:1;color:var(--ink-3)}
.goal h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0}
.goal p{margin:4px 0 10px;color:var(--ink-2);max-width:75ch}
.ms{list-style:none;padding:0;margin:0 0 10px;font-size:14px}
.ms li{display:flex;gap:10px;padding:2px 0}
.ms time{color:var(--ink-3);min-width:92px}
.ms .past{color:var(--ink-3)}
.fields{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:14px}
.fields label{display:flex;flex-direction:column;gap:3px;color:var(--ink-2)}
.fields input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:5px 8px;min-width:200px}
.autos{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px;margin-bottom:10px}
.autos b{font-weight:600}

/* log & data */
table.log{width:100%;border-collapse:collapse;font-size:14px}
table.log td,table.log th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
table.log th{font-weight:600;color:var(--ink-2)}
.tag{font-size:12px;padding:1px 7px;border-radius:999px;border:1px solid currentColor}
.tag.late{color:var(--late)} .tag.ok{color:var(--ok)} .tag.warn{color:var(--miss)}
.tablewrap{overflow-x:auto}
.data section{margin:22px 0;max-width:75ch}
.data h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 6px}
.data p{color:var(--ink-2);margin:6px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ===== Plan generator ===== */
const pad = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const START_KEY = PHASES[0].from, END_KEY = PHASES[PHASES.length-1].to;

function queue(items, filler) {
  let i = 0;
  return { next(){ if (i < items.length) return items[i++]; return typeof filler === 'function' ? filler(i++ - items.length) : filler; },
           get done(){ return i >= items.length; }, get i(){ return i; } };
}

function buildPlan() {
  /* --- unit lists --- */
  const statUnits = [];
  STAT_LECT.forEach((name,i) => {
    statUnits.push({t:`Stat 110 lecture ${i+1}: ${name}`, d:'Watch the lecture (about 50 min). Pause and re-derive each result before Blitzstein does.', depth:'Notes in your own words; every formula re-derived once.', l:[R.stat110yt,R.stat110], tag:'stat'});
    const ch = STAT_CH[i];
    statUnits.push({t:`Stat 110 practice: ${name}`, d: ch ? `Strategic Practice problems on this topic from the course site, then 2 exercises from book ch. ${ch}.` : 'Work through the practice midterm from the course site, half of it in 60 minutes.', depth:'15 minutes per problem before looking at solutions. Write full solutions, not just answers.', l:[R.stat110,R.probbook], tag:'statp'});
    if (ch && STAT_CH[i+1] !== ch) statUnits.push({t:`Book ch. ${ch} (${CH_NAMES[ch]}): end-of-chapter exercises`, d:'Do 8 exercises, prioritising those with published solutions so you can check.', depth:'Mixed difficulty; at least 2 hard ones.', l:[R.probbook], tag:'statc'});
  });
  const stat = queue(statUnits, k => ({t:`Stat 110 final review ${k+1}: past final exam problems, 60 minutes timed`, d:'From the course site’s practice exams. Re-solve misses on Sunday.', depth:'Exam conditions.', l:[R.stat110], tag:'statr'}));

  const laUnits = [
    {t:'Warm-up: Essence of linear algebra, videos 1–8', d:'Watch at 1.25×.', depth:'Intuition only.', l:[R.eola], tag:'lap'},
    {t:'Warm-up: Essence of linear algebra, videos 9–16', d:'Watch at 1.25×.', depth:'Intuition only.', l:[R.eola], tag:'lap'},
  ];
  L1806.forEach((name,i) => {
    laUnits.push({t:`18.06 lecture ${i+1}: ${name}`, d:'Watch the lecture; do the matching recitation video on OCW if there is one.', depth:'Reproduce every example by hand.', l:[R.yt1806,R.ocw1806], tag:'la'});
    if ((i+1) % 3 === 0) laUnits.push({t:`18.06 problem set for lectures ${i-1}–${i+1}`, d:'From the OCW Assignments page; full attempt before checking solutions.', depth:'All problems.', l:[R.ocw1806], tag:'lap'});
    if ([12,24,33].includes(i)) laUnits.push({t:'18.06 exam from OCW, timed (50 min)', d:'Grade it with the posted solutions; redo misses on Sunday.', depth:'Exam conditions.', l:[R.ocw1806], tag:'lap'});
  });
  const la = queue(laUnits, k => ({t:'18.06 review: re-do your weakest topic plus 6 exercises', d:'Pick from your exam misses.', depth:'Until you can teach it.', l:[R.ocw1806], tag:'lap'}));
  const opt = queue(MATHOPT.map(([t,depth,l]) => ({t, d:'Work through the material with pen and paper.', depth, l, tag:'opt'})), k => ({t:'ML math review: redo one derivation you got wrong', d:'From your self-test log.', depth:'Closed book.', l:[R.mml], tag:'opt'}));
  const green = queue(GREEN.map(([t]) => ({t:'Green Book '+t, d:'A Practical Guide to Quantitative Finance Interviews (Zhou). Do every problem in this section.', depth:'15-minute cap per problem, then read the solution. Log misses for Sunday.', l:[], tag:'green'})), null);
  let qi = 0; const quantNext = () => { const [t,depth,l] = QUANT_P4[qi++ % QUANT_P4.length]; return {t, d:'Quant interview practice.', depth, l, tag:'quant'}; };
  const fifty = queue(Array.from({length:19}, (_,k) => ({t:`Fifty Challenging Problems in Probability: problems ${k*3+1}–${Math.min(k*3+3,56)}`, d:'Mosteller (Dover). Attempt each fully before reading his solution.', depth:'20 minutes per problem maximum.', l:[], tag:'fifty'})), null);
  const neet = queue(NEET, null);
  let topicI = 0, csesI = 0, csesLeft = CSES_SECTIONS[0][1];
  const nextCses = () => { while (csesLeft <= 0 && csesI < CSES_SECTIONS.length-1) { csesI++; csesLeft = CSES_SECTIONS[csesI][1]; } csesLeft--; return CSES_SECTIONS[csesI][0]; };
  const papers = queue(PAPERS, null);
  const mlf = queue(MLF, k => ['ML interview drill: answer 10 questions from the ML Interviews Book out loud', [R.mlib]]);
  const cs = queue(CS, k => ({t:'CS review: re-implement one structure from your projects from memory', d:'Buffer pool, B+ tree node split, or an epoll loop.', l:[], tag:'csr'}));

    const key = keyOf(d), dow = d.getDay(), mon = key.slice(0,7);
    const ph = PHASES.find(p => key >= p.from && key <= p.to).id;
    const T = [];

    const isLastOfMonth = addDays(d,1).getDate() === 1;

    const repro = [...REPROS].reverse().find(r => key >= r.from);
    const rWeek = Math.min(8, Math.floor((d - parseKey(repro.from)) / 864e5 / 7));

    if (dow >= 1 && dow <= 5) {
      /* A: algorithms */
      if (dow === 3) {
        add('cf','Algorithms',120,'Codeforces round: live if one is scheduled this week, otherwise a virtual Div. 2',{d:'Live rounds usually start 23:35 JST; a virtual round at your own time counts. Then upsolve at least one problem you didn’t solve.', depth:'Full contest conditions, no editorial during the round.', l:[R.cf], tag:'contest'});
      } else if (!neet.done) {
        const n = ph === 1 ? 4 : 3, probs = [];
        for (let k=0;k<n && !neet.done;k++) probs.push(neet.next());
        add('neet','Algorithms',100,`NeetCode 150: ${probs.map(p=>p.name).join(', ')}`,{d:`Topic: ${[...new Set(probs.map(p=>p.cat))].join(' / ')}. Solve in C++ from a blank file.` + (probs.some(p=>p.prem)?' Problems marked premium on LeetCode are free on neetcode.io.':''), depth:'25-minute cap before a hint. Write time and space complexity. Anything that needed a hint goes on Sunday’s re-solve list.', l:[...probs.map(p => [p.name, p.prem ? 'https://neetcode.io/practice' : `https://leetcode.com/problems/${p.slug}/`]), R.neet], tag:'neet', n:probs.length});
      } else if (dow === 1) {
        const [tn,tu] = TOPICS[topicI++ % TOPICS.length];
        add('topic','Algorithms',90,`Topic of the week: ${tn}`,{d:'Read the article, implement the template from memory, then solve 2 problems from its practice list.', depth:'You can rewrite the template in under 10 minutes without notes.', l:[[tn,tu],R.cph], tag:'cp'});
      } else if (dow === 4) {
        const sec = nextCses();
        add('cses','Algorithms',90,`CSES ${sec}: next 3 unsolved problems in listed order`,{d:'Submit each until accepted.', depth:'30-minute cap each; read a hint only after the cap.', l:[R.cses,R.cph], tag:'cp'});
      } else {
        const r = CF_LADDER[mon] || 1400;
        add('ladder','Algorithms',90,`Codeforces ladder: 3 problems rated ${r}–${r+100}`,{d:'Pick unsolved problems from the filtered problemset, highest solve count first.', depth:'40-minute cap each, then the editorial; re-solve the next day without looking.', l:[[`Problemset ${r}–${r+100}`, `https://codeforces.com/problemset?tags=${r}-${r+100}`]], tag:'cp'});
      }

      /* B: math */
      let mu = null;
      if (ph === 1) mu = stat.next();
      else if (ph === 2) mu = ([1,3,5].includes(dow) || key < '2027-02-01') ? stat.next() : la.next();
      else if (ph === 3) mu = [1,3,5].includes(dow) ? (key < '2027-07-01' ? la.next() : opt.next()) : (green.done ? quantNext() : green.next());
      else mu = green.done ? quantNext() : green.next();
      add('math','Math',60,mu.t,{d:mu.d, depth:mu.depth, l:mu.l, tag:mu.tag});
      if (ph >= 3) add('zeta','Math',10,'Zetamac: 2 runs of 120 seconds, default settings',{d:'Log your best score in today’s notes.', depth:'Target 40+ by August, 50+ by October.', l:[R.zeta], tag:'zeta'});

      /* C: rotating hour */
      if (dow === 1 || dow === 4) {
        const p = papers.next();
        if (p) add('paper','Research',50,`Read: ${p[0]}`,{d:'Three-pass method. Write a 5-line summary in today’s notes: problem, key idea, method, result, limitation.', depth:`Passes 1 and 2 always. Pass 3 (re-derive the key equation) when it relates to ${repro.name}.`, l:[ax(p[1]),R.keshav], tag:'paper'});
      } else if (dow === 2) {
        add('repro1','Research',60,`${repro.name}, week ${rWeek+1} (session 1): ${repro.m[rWeek]}`,{d:`Target for this reproduction: ${repro.target}`, depth:'Code from the paper first; consult reference code only when stuck for 30+ minutes, and note it in the README.', l:[ax(repro.paper),...repro.links], tag:'repro'});
      } else if (dow === 3) {
        const mi = (d.getFullYear()-2026)*12 + d.getMonth() - 10;
        const weds = []; for (let x = new Date(d.getFullYear(), d.getMonth(), 1); x.getMonth() === d.getMonth(); x = addDays(x,1)) if (x.getDay() === 3) weds.push(x.getDate());
        const wi = weds.indexOf(d.getDate());
        let sn, sd, step;
        if (weds.length === 5) { step = wi; [sn, sd] = SD_STEPS[wi]; }
        else if (wi < 3) { step = wi; [sn, sd] = SD_STEPS[wi]; }
        else { step = 4; sn = 'Monitoring, mock and final write-up'; sd = SD_STEPS[3][1] + ' ' + SD_STEPS[4][1]; }
        add('sd','System design',60,`ML system design: ${SD_TOPICS[Math.max(0,Math.min(11,mi))]}. ${sn}`,{d:sd, depth:'Interview depth: numbers, trade-offs, and what you’d cut first.', l:[R.chip,R.cs329s,R.sdp], tag: step === 4 ? 'sd' : 'sdw'});
      } else if (dow === 5) {
        if (ph === 1) {
          const c = careerP1.next();
          if (c) add('career','Career',60,c[0],{d:c[1], l:c[2], tag:'career'});
        } else if (ph === 2) {
          const sp = {'2027-01-01':'Launch day: final resume check, send the first 6 applications, ask 2 people for referrals.','2027-03-05':'Negotiation prep: research comp bands for each live process, write your walk-away number and counter script.','2027-04-02':'Offer comparison: score live offers on pay, brand, relevance to quant/AI, hours, visa. Decide what you’d accept.','2027-04-30':'Stage 1 deadline. If an offer is signed, plan your notice and onboarding. If not, write what blocked you and adjust the plan.'}[key];
          add('career','Career',60, sp || 'Application sprint: 6 tailored applications (tiers 1–2), 2 referral asks, follow up on anything older than 10 days, update your tracker',{d:'Tailor the top third of your resume to each role.', l:[R.tokyodev,R.japandev,R.levels], tag:'career'});
        } else if (ph === 3) {
          const w = Math.floor((d.getDate()-1)/7);
          const items = ['Update your resume with this month’s wins (repro results, work impact).','Reach out to 2 people at target firms (trading firms, AI labs) for a 20-minute chat.','Research global targets: Singapore, Hong Kong, London, Dubai. Note comp, tax and the visa route for each.','Publish a short write-up of this month’s reproduction progress.','Clean up your GitHub: pin the best repos, fix READMEs.'];
          add('career','Career',60,items[w],{l:[R.levels], tag:'career'});
        } else {
          const t = key === '2027-09-03' ? 'Make a quant-dev version of your resume: latency, throughput, statistics, C++ and contest results at the top.' : 'Stretch sprint: 5 applications to quant-dev / ML roles at trading firms and top AI labs (any country), 2 referral asks, follow-ups.';
          add('career','Career',60,t,{l:[R.levels], tag:'career'});
        }
      }

      /* D: fundamentals 40 min (Mon, Tue, Thu, Fri) */
      if (dow !== 3) {
        if (key < '2027-02-01') {

        } else {
          const u = cs.next();
          add('fund','Fundamentals',40,u.t,{d:u.d, depth:'Understand it well enough to answer “how does this work under the hood?” in an interview.', l:u.l, tag:u.tag});
        }
      }

      add('abc','Algorithms',130,'AtCoder Beginner Contest (Saturdays 21:00 JST), then upsolve',{d:'Do it live. Afterwards upsolve up to problem E within the week.', depth:'Full contest conditions.', l:[R.atc], tag:'contest'});
      add('repro2','Research', ph <= 2 ? 120 : 90, `${repro.name}, week ${rWeek+1} (session 2): finish “${repro.m[rWeek]}”`,{d:'Commit, then write 3 lines in the repro log: what works, the current metric, what’s next.', depth:`Target: ${repro.target}`, l:[ax(repro.paper),...repro.links], tag:'repro'});
      if (key >= '2027-04-03') add('contrib','Contribution',60,contrib.next(),{d:'Goal 9: one original contribution that someone else validates.', tag:'contrib'});
    } else {
      add('review','Review',25,'Weekly review',{d:'Re-solve every problem you needed a hint for this week. Log your Codeforces rating and hours in the Goals tab. Write next week’s one risk.', depth:'Honest numbers only.', tag:'review'});
      if (key >= '2027-01-03') {
        const rot = ph === 4 ? ['Quant probability mock','Coding mock','Quant probability mock','ML system design mock'] : ['Coding mock','ML system design mock','Behavioral mock','Coding mock'];
        const wk = Math.floor((d - parseKey('2027-01-03'))/864e5/7);
        add('mock','Interview',60,`Mock interview: ${rot[wk % 4]}`,{d:'With a peer or a paid platform. Record pass/fail in the Goals tab.', depth:'Treat it as real: camera on, timed, no notes.', l:[R.iio,R.exponent], tag:'mock'});
      }
      if (ph >= 3) { const f = fifty.next(); add('fifty','Math',40, f ? f.t : 'Quant: re-solve 3 problems you missed this week', {d: f ? f.d : 'From your miss log.', depth: f ? f.depth : 'Closed book.', l:[], tag: f ? 'fifty' : 'quant'}); }
      add('rest','Rest',0,'Nothing else is required today. Rest is part of the plan.',{req:false, tag:'rest'});
    }

    if (key === '2026-12-31') add('yearend','Career',30,CAREER_P1[8][0],{d:CAREER_P1[8][1], tag:'career'});
    if (isLastOfMonth) add('monthly','Review',30,'Monthly review: mark each goal green, yellow or red',{d:'Update every metric in the Goals tab. If several goals are red, cut depth from CS fundamentals first, then ML math. Protect algorithms, interviews and reproductions.', tag:'review'});
    GOALS.forEach(g => g.ms.forEach(([mk, mt]) => { if (mk === key) add('cp'+g.n+'-'+mt.length,'Checkpoint',0,`Checkpoint (goal ${g.n}): ${mt}`,{req:false, tag:'checkpoint'}); }));

    days.push({key, dow, ph, idx:dayIdx, todos:T});
  }
  return days;
}

const PLAN = buildPlan();
const BY_KEY = Object.fromEntries(PLAN.map(d => [d.key, d]));
const STORE = 'grind-progress-v1';
const GRACE_H = 4; // work finished before 04:00 the next morning still counts as on time
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = (k, opt={weekday:'long', day:'numeric', month:'long', year:'numeric'}) => parseKey(k).toLocaleDateString('en-GB', opt);
const fmtTime = ts => new Date(ts).toLocaleString('en-GB', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});

let memStore = null;
function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(STORE); } catch (e) { raw = memStore; }
  const base = {v:1, checks:{}, notes:{}, hours:{}, metrics:{}, metricLog:[], log:[], maxSeen:0, theme:'auto', created:Date.now()};
  try { return raw ? Object.assign(base, JSON.parse(raw)) : base; } catch (e) { return base; }
}
let S = loadState();
let tamper = false, view = 'day', selKey = null, fileHandle = null, fileStatus = 'none', lastWrite = 0;

function nowTs() {
  const t = Date.now();
  if (t < S.maxSeen - 120000) {
    if (!tamper) { tamper = true; S.log.push({t:S.maxSeen, type:'clock', msg:'Device clock moved backwards. Using the latest time seen instead.'}); persist(); }
    return S.maxSeen;
  }
  tamper = false;
  return t;
}
const todayKey = () => keyOf(new Date(nowTs()));
const deadline = k => { const d = parseKey(k); d.setDate(d.getDate()+1); d.setHours(GRACE_H,0,0,0); return d.getTime(); };

function persist() {
  S.maxSeen = Math.max(S.maxSeen, Date.now() > S.maxSeen - 120000 ? Date.now() : 0);
  const json = JSON.stringify(S);
  try { localStorage.setItem(STORE, json); } catch (e) { memStore = json; }
  scheduleFileWrite();
}

/* ----- status ----- */
function dayStatus(day, tk = todayKey()) {
  const req = day.todos.filter(t => t.req), c = S.checks[day.key] || {};
  const done = req.filter(t => c[t.id]);
  if (day.key > tk) return 'future';
  if (req.length && done.length === req.length) return Math.max(...done.map(t => c[t.id])) < deadline(day.key) ? 'ontime' : 'late';
  if (day.key === tk) return done.length ? 'progress' : 'open';
  if (nowTs() < deadline(day.key)) return done.length ? 'progress' : 'open'; // still within grace
  return done.length ? 'partial' : 'missed';
}
const STATUS_TXT = {ontime:'Completed on time', late:'Completed late', partial:'Partly done, missed', missed:'Missed', future:'Upcoming', open:'Open', progress:'In progress'};
function tally() {
  const tk = todayKey(), r = {ontime:0, late:0, partial:0, missed:0};
  PLAN.forEach(d => { const s = dayStatus(d, tk); if (s in r) r[s]++; });
  let streak = 0;
  for (let i = PLAN.findIndex(d => d.key === tk); i >= 0; i--) {
    const s = dayStatus(PLAN[i], tk);
    if (s === 'ontime') streak++; else if (PLAN[i].key === tk && (s === 'open' || s === 'progress')) continue; else break;
  }
  const hours = Object.values(S.hours).reduce((a, h) => a + (+h || 0), 0);
  return {...r, streak, hours};
}

/* ----- actions ----- */
function toggle(dayKey, todo, checked) {
  const tk = todayKey();
  if (dayKey > tk) return toast('This day hasn’t started yet.');
  S.checks[dayKey] = S.checks[dayKey] || {};
  const t = nowTs();
  if (checked) {
    S.checks[dayKey][todo.id] = t;
    const late = t >= deadline(dayKey);
    const lateDays = late ? Math.ceil((t - deadline(dayKey)) / 864e5) || 1 : 0;
    S.log.push({t, type:'check', day:dayKey, id:todo.id, title:todo.t, late, lateDays});
    if (late) toast(`Logged as late (${lateDays} day${lateDays > 1 ? 's' : ''} after the deadline).`);
  } else {
    delete S.checks[dayKey][todo.id];
    S.log.push({t, type:'uncheck', day:dayKey, id:todo.id, title:todo.t});
  }
  persist(); render();
}

/* ----- rendering ----- */
function render() {
  document.documentElement.dataset.theme = S.theme === 'auto' ? '' : S.theme;
  if (S.theme === 'auto') delete document.documentElement.dataset.theme;
  const tk = todayKey();
  if (!selKey) selKey = BY_KEY[tk] ? tk : (tk < START_KEY ? START_KEY : END_KEY);
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.v === view ? 'page' : 'false'));
  $('#banner').innerHTML = tamper ? '<div class="banner">Your device clock is earlier than a time this tracker has already seen. Locks and lateness use the latest time seen, so changing the clock won’t unlock or back-date anything.</div>' : '';
  const main = $('#main');
  if (view === 'day') main.innerHTML = renderStrip(tk) + renderDay(BY_KEY[selKey], tk);
  else if (view === 'goals') main.innerHTML = renderGoals(tk);
  else if (view === 'log') main.innerHTML = renderLog();
  else main.innerHTML = renderData();
  bind();
  const sel = $('.cell.sel'), strip = $('.strip'); if (sel && strip) strip.scrollLeft = sel.offsetLeft - strip.clientWidth / 2;
}

function renderStrip(tk) {
  const first = parseKey(START_KEY), lead = (first.getDay() + 6) % 7; // Monday-first
  let html = '<div class="strip" aria-label="Year at a glance"><div class="strip-inner">';
  const cells = Array(lead).fill(null).concat(PLAN);
  const weeks = Math.ceil(cells.length / 7);
  let lastMonth = '';
  for (let w = 0; w < weeks; w++) {
    const wk = cells.slice(w*7, w*7+7);
    const firstReal = wk.find(Boolean);
    const m = firstReal ? firstReal.key.slice(0,7) : '';
    const label = m && m !== lastMonth ? parseKey(firstReal.key).toLocaleDateString('en-GB', {month:'short'}) : '';
    if (label) lastMonth = m;
    html += `<span class="mlabel" style="grid-column:${w+1}">${label}</span>`;
    for (let r = 0; r < 7; r++) {
      const d = wk[r];
      if (!d) { html += `<span class="cell blank" style="grid-column:${w+1};grid-row:${r+2}"></span>`; continue; }
      const s = dayStatus(d, tk);
      html += `<button class="cell ${s}${d.key === tk ? ' today' : ''}${d.key === selKey ? ' sel' : ''}" style="grid-column:${w+1};grid-row:${r+2}" data-day="${d.key}" title="${fmtDate(d.key,{weekday:'short',day:'numeric',month:'short'})}: ${STATUS_TXT[s]}" aria-label="${fmtDate(d.key)}: ${STATUS_TXT[s]}"></button>`;
    }
  }
  html += '</div></div><div class="legend">' + [['ok','On time'],['late','Late'],['miss','Missed'],['future','Upcoming']].map(([c,t]) => `<span><i style="background:var(--${c})"></i>${t}</span>`).join('') +
    '<span><i style="background:repeating-linear-gradient(45deg,var(--miss) 0 2px,var(--future) 2px 4px)"></i>Partly done</span><span><i style="background:var(--future);box-shadow:inset 0 0 0 2px var(--hl)"></i>Today</span></div>';
  return html;
}

function renderDay(day, tk) {
  const s = dayStatus(day, tk), c = S.checks[day.key] || {};
  const ph = PHASES.find(p => p.id === day.ph);
  const req = day.todos.filter(t => t.req), done = req.filter(t => c[t.id]).length;
  const mins = req.reduce((a, t) => a + t.min, 0);
  const locked = day.key > tk;
  let notice = '';
  if (locked) notice = `<div class="notice">Locked until ${fmtDate(day.key,{day:'numeric',month:'long'})}. You can read ahead, but items can only be checked off from that day.</div>`;
  else if (day.key < tk && s !== 'ontime' && nowTs() >= deadline(day.key)) notice = `<div class="notice warn">This day has passed. Anything you check off now is logged as late, with the time you did it.</div>`;
  const groups = [];
  day.todos.forEach(t => { let g = groups.find(x => x.b === t.block); if (!g) groups.push(g = {b:t.block, items:[]}); g.items.push(t); });
  const blocks = groups.map(g => `<section class="block"><h2>${esc(g.b)}<small>${g.items.reduce((a,t)=>a+t.min,0) ? g.items.reduce((a,t)=>a+t.min,0)+' min' : ''}</small></h2>` + g.items.map(t => {
    const ts = c[t.id], late = ts && ts >= deadline(day.key);
    return `<div class="todo${ts ? ' done' : ''}${t.tag === 'checkpoint' ? ' checkpoint' : ''}">
      <input type="checkbox" data-todo="${t.id}" ${ts ? 'checked' : ''} ${locked ? 'disabled' : ''} aria-label="${esc(t.t)}">
      <div><div class="tt">${esc(t.t)}${t.req ? '' : '<span class="opt">optional</span>'}${t.min ? ` <span class="opt">${t.min} min</span>` : ''}</div>
      ${t.d ? `<div class="det">${esc(t.d)}</div>` : ''}
      ${t.depth ? `<div class="depth"><b>Depth:</b> ${esc(t.depth)}</div>` : ''}
      ${t.l && t.l.length ? `<div class="links">${t.l.map(([n,u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join('')}</div>` : ''}
      ${ts ? `<div class="stamp${late ? ' late' : ''}">${late ? 'Done late' : 'Done'}: ${fmtTime(ts)}</div>` : ''}</div></div>`;
  }).join('') + '</section>').join('');
  const T = tally();
  const repro = [...REPROS].reverse().find(r => day.key >= r.from);
  return `<div class="layout"><div>
    <div class="dayhead"><div><h1>${fmtDate(day.key)}</h1>
      <div class="meta">Day ${day.idx+1} of ${PLAN.length}, phase ${ph.id}: ${esc(ph.name)}<span class="chip ${s}">${STATUS_TXT[s]}</span></div></div>
      <div class="navbtns"><button class="btn" data-nav="-1" aria-label="Previous day">Previous</button><button class="btn" data-nav="today">Today</button><button class="btn" data-nav="1" aria-label="Next day">Next</button></div></div>
    ${notice}${blocks}</div>
    <aside>
      <div class="panel"><h3>This day</h3>
        <div class="stats"><span>Required items</span><span>${done} / ${req.length}</span><span>Planned time</span><span>${Math.floor(mins/60)} h ${mins%60} min</span></div>
        <div class="bar"><i style="width:${req.length ? done/req.length*100 : 0}%"></i></div>
        <p class="muted">A day counts as on time when every required item is checked before 0${GRACE_H}:00 the next morning.</p>
        <label>Hours actually worked<input type="number" min="0" max="16" step="0.25" id="hours" value="${esc(S.hours[day.key] ?? '')}" ${locked ? 'disabled' : ''}></label></div>
      <div class="panel"><h3>Notes</h3><textarea id="notes" placeholder="Paper summaries, Zetamac score, what broke, what you learned." ${locked ? 'disabled' : ''}>${esc(S.notes[day.key] || '')}</textarea></div>
      <div class="panel"><h3>So far</h3><div class="stats">
        <span>On-time streak</span><span>${T.streak} days</span><span>On time</span><span>${T.ontime}</span><span>Late</span><span>${T.late}</span><span>Missed or partial</span><span>${T.missed + T.partial}</span><span>Hours logged</span><span>${T.hours.toFixed(1)}</span></div></div>
      <div class="panel"><h3>Phase ${ph.id}</h3><p class="muted" style="margin:0 0 8px">${esc(ph.aim)}</p><p class="muted" style="margin:0">Reproduction: ${esc(repro.name)}. Target: ${esc(repro.target)}</p></div>
    </aside></div>`;
}

function autoCounts() {
  const count = tag => PLAN.reduce((a, d) => a + d.todos.filter(t => t.tag === tag && (S.checks[d.key] || {})[t.id]).length, 0);
  const total = tag => PLAN.reduce((a, d) => a + d.todos.filter(t => t.tag === tag).length, 0);
  return {
    stat:['Stat 110 lectures', count('stat'), total('stat')], green:['Green Book sections', count('green'), total('green')], fifty:['Fifty Challenging sets', count('fifty'), total('fifty')],
    la:['18.06 lectures', count('la'), total('la')], opt:['Calculus and optimization units', count('opt'), total('opt')],
    paper:['Papers read', count('paper'), total('paper')], sd:['Designs written up', count('sd'), total('sd')], cs:['CS units', count('cs'), total('cs')],
  };
}
function renderGoals(tk) {
  const A = autoCounts();
  return '<div style="margin-top:18px">' + GOALS.map(g => `<div class="goal"><div class="num">${g.n}</div><div>
    <h2>${esc(g.t)}</h2><p>${esc(g.s)}</p>
    ${g.auto ? `<div class="autos">${g.auto.map(a => `<span>${A[a][0]}: <b>${A[a][1]}</b> / ${A[a][2]}</span>`).join('')}</div>` : ''}
    <ul class="ms">${g.ms.map(([k,t]) => `<li class="${k < tk ? 'past' : ''}"><time>${fmtDate(k,{day:'numeric',month:'short',year:'numeric'})}</time><span>${esc(t)}</span></li>`).join('')}</ul>
    ${g.fields ? `<div class="fields">${g.fields.map(([id,lab]) => `<label>${esc(lab)}<input data-metric="${id}" value="${esc(S.metrics[id] || '')}"></label>`).join('')}</div>` : ''}
    ${g.fields ? metricHistory(g.fields.map(f => f[0])) : ''}</div></div>`).join('') + '</div>';
}
function metricHistory(ids) {
  const h = S.metricLog.filter(m => ids.includes(m.id)).slice(-4).reverse();
  return h.length ? `<p class="muted" style="margin-top:8px">${h.map(m => `${fmtTime(m.t)}: ${esc(m.v)}`).join('<br>')}</p>` : '';
}
function renderLog() {
  const rows = S.log.slice(-400).reverse().map(e => `<tr><td>${fmtTime(e.t)}</td><td>${e.type === 'check' ? (e.late ? `<span class="tag late">Late by ${e.lateDays}d</span>` : '<span class="tag ok">On time</span>') : e.type === 'uncheck' ? '<span class="tag">Unchecked</span>' : '<span class="tag warn">Clock</span>'}</td><td>${e.day ? `<a href="#" data-goto="${e.day}">${fmtDate(e.day,{day:'numeric',month:'short'})}</a>` : ''}</td><td>${esc(e.title || e.msg || '')}</td></tr>`).join('');
  return `<div style="margin-top:18px"><h1 style="font-family:var(--serif);font-weight:400;margin:0 0 10px">Activity log</h1><p class="muted">Every check and uncheck is recorded with the time it happened. Nothing here can be edited.</p>
    <div class="tablewrap"><table class="log"><thead><tr><th>When</th><th>Status</th><th>Day</th><th>Item</th></tr></thead><tbody>${rows || '<tr><td colspan="4">Nothing logged yet. Check off your first item on the Today view.</td></tr>'}</tbody></table></div></div>`;
}
function renderData() {
  const fsOk = 'showSaveFilePicker' in window;
  const st = {none:'No progress file linked.', linked:`Linked to ${esc(fileHandle?.name)}. Every change is written to it automatically${lastWrite ? `, last at ${fmtTime(lastWrite)}` : ''}.`, needs:`Linked to ${esc(fileHandle?.name)}, but the browser needs your permission again.`}[fileStatus];
  return `<div class="data">
  <section><h2>Where your progress lives</h2><p>Progress saves automatically in this browser on this device. It works offline. To keep a copy you can read, back up or move to another device, link a Markdown progress file or export one.</p></section>
  <section><h2>Progress file</h2>${fsOk ? `<p>${st}</p><div class="row">
    ${fileStatus === 'needs' ? '<button class="btn primary" data-act="reconnect">Reconnect progress file</button>' : ''}
    <button class="btn" data-act="link">Create a new progress file</button><button class="btn" data-act="open">Open an existing progress file</button></div>
    <p class="muted">The file is Markdown: a readable day-by-day log, plus a data block at the end that this page reads back.</p>` :
    '<p>This browser can’t write to files directly (that needs Chrome or Edge on a computer). Use export and import below instead.</p>'}</section>
  <section><h2>Export and import</h2><div class="row"><button class="btn" data-act="export">Download progress (.md)</button><label class="btn" style="cursor:pointer">Load progress from a file<input type="file" accept=".md,.json,.txt" data-act="import" hidden></label></div>
    <p class="muted">Loading a file replaces the progress in this browser. To move between devices, export on one and load on the other, or keep the linked file in a synced folder.</p></section>
  <section><h2>Using it on a phone</h2><p>Phones often won’t run a page opened straight from the Files app. The simplest route is to host this one file somewhere private, like GitHub Pages, open it in your phone’s browser, and move progress with export and import.</p></section>
  <section><h2>Theme</h2><div class="row">${['auto','light','dark'].map(t => `<button class="btn${S.theme === t ? ' primary' : ''}" data-theme-set="${t}">${t === 'auto' ? 'Match device' : t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></section>
  <section><h2>How lateness works</h2><p>Items can only be checked from their own day onward. A day is on time when all required items are checked before 0${GRACE_H}:00 the next morning, so late contests still count. After that, checks are logged as late with the real time. If the device clock is set backwards, the tracker keeps using the latest time it has seen.</p></section>
  <section><h2>Erase everything</h2><div class="row"><button class="btn danger" data-act="reset">Erase all progress</button></div></section></div>`;
}

/* ----- events ----- */
function go(k) { if (BY_KEY[k]) { selKey = k; view = 'day'; location.hash = k; render(); } }
function bind() {
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => go(b.dataset.day));
  document.querySelectorAll('[data-goto]').forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.goto); });
  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => {
    if (b.dataset.nav === 'today') return go(BY_KEY[todayKey()] ? todayKey() : START_KEY);
    const i = BY_KEY[selKey].idx + +b.dataset.nav; if (PLAN[i]) go(PLAN[i].key);
  });
  document.querySelectorAll('[data-todo]').forEach(cb => cb.onchange = () => toggle(selKey, BY_KEY[selKey].todos.find(t => t.id === cb.dataset.todo), cb.checked));
  const notes = $('#notes'); if (notes) notes.oninput = debounce(() => { S.notes[selKey] = notes.value; persist(); }, 500);
  const hours = $('#hours'); if (hours) hours.onchange = () => { S.hours[selKey] = hours.value; persist(); render(); };
  document.querySelectorAll('[data-metric]').forEach(inp => inp.onchange = () => { S.metrics[inp.dataset.metric] = inp.value; S.metricLog.push({t:nowTs(), id:inp.dataset.metric, v:inp.value}); persist(); render(); });
  document.querySelectorAll('[data-theme-set]').forEach(b => b.onclick = () => { S.theme = b.dataset.themeSet; persist(); render(); });
  document.querySelectorAll('[data-act]').forEach(el => {
    const a = el.dataset.act;
    if (a === 'import') el.onchange = () => el.files[0] && importFile(el.files[0]);
    else el.onclick = () => ({link:linkFile, open:openFile, reconnect:reconnect, export:exportMd, reset:resetAll})[a]();
  });
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }

/* ----- markdown file format ----- */
function toMarkdown() {
  const tk = todayKey(), T = tally();
  let md = `# 12-month plan: progress log\n\nExported ${new Date(nowTs()).toLocaleString('en-GB')}\n\n`;
  md += `On time: ${T.ontime} days. Late: ${T.late}. Missed or partial: ${T.missed + T.partial}. On-time streak: ${T.streak}. Hours logged: ${T.hours.toFixed(1)}.\n\n`;
  md += `## Metrics\n\n` + Object.entries(S.metrics).map(([k,v]) => `- ${k}: ${v}`).join('\n') + '\n\n## Days\n';
  PLAN.filter(d => d.key <= tk).forEach(d => {
    const c = S.checks[d.key] || {}, s = dayStatus(d, tk);
    md += `\n### ${d.key} (${fmtDate(d.key,{weekday:'short'})}): ${STATUS_TXT[s]}\n\n`;
    d.todos.filter(t => t.tag !== 'rest').forEach(t => { const ts = c[t.id]; md += `- [${ts ? 'x' : ' '}] ${t.block}: ${t.t}${ts ? ` (${ts >= deadline(d.key) ? 'late, ' : ''}${fmtTime(ts)})` : ''}${t.req ? '' : ' (optional)'}\n`; });
    if (S.hours[d.key]) md += `\nHours: ${S.hours[d.key]}\n`;
    if (S.notes[d.key]) md += `\nNotes:\n\n${S.notes[d.key].split('\n').map(l => '> ' + l).join('\n')}\n`;
  });
  md += `\n<!-- grind-data\n${JSON.stringify(S)}\n-->\n`;
  return md;
}
function fromText(text) {
  const m = text.match(/<!-- grind-data\n([\s\S]*?)\n-->/);
  const json = m ? m[1] : text.trim();
  const data = JSON.parse(json);
  if (!data || data.v !== 1 || !data.checks) throw new Error('not a progress file');
  return data;
}
function exportMd() {
  const blob = new Blob([toMarkdown()], {type:'text/markdown'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `grind-progress-${todayKey()}.md`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Progress downloaded.');
}
async function importFile(file) {
  try {
    const data = fromText(await file.text());
    if (!confirm('Replace the progress in this browser with the progress in this file?')) return;
    data.maxSeen = Math.max(data.maxSeen || 0, S.maxSeen); S = data; persist(); render(); toast('Progress loaded.');
  } catch (e) { toast('That file doesn’t contain progress from this tracker.'); }
}
function resetAll() {
  if (prompt('Type erase to delete all progress in this browser.') !== 'erase') return;
  const maxSeen = S.maxSeen; S = loadState(); S.checks = {}; S.notes = {}; S.hours = {}; S.metrics = {}; S.metricLog = []; S.log = []; S.maxSeen = maxSeen;
  persist(); render(); toast('All progress erased.');
}

/* ----- File System Access (Chrome/Edge desktop) ----- */
const idb = () => new Promise((res, rej) => { const r = indexedDB.open('grind', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbSet = async (k, v) => { const db = await idb(); return new Promise(r => { const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = r; }); };
const idbGet = async k => { const db = await idb(); return new Promise(r => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); };
async function linkFile() {
  try { fileHandle = await showSaveFilePicker({suggestedName:'grind-progress.md', types:[{description:'Markdown', accept:{'text/markdown':['.md']}}]});
    await idbSet('handle', fileHandle); fileStatus = 'linked'; await writeFile(); render(); toast('Progress file linked.'); } catch (e) {}
}
async function openFile() {
  try { const [h] = await showOpenFilePicker({types:[{description:'Markdown', accept:{'text/markdown':['.md']}}]});
    const data = fromText(await (await h.getFile()).text());
    if (!confirm('Replace the progress in this browser with the progress in this file?')) return;
    if ((await h.requestPermission({mode:'readwrite'})) !== 'granted') return toast('Write permission is needed to keep the file updated.');
    fileHandle = h; await idbSet('handle', h); data.maxSeen = Math.max(data.maxSeen || 0, S.maxSeen); S = data; fileStatus = 'linked'; persist(); render(); toast('Progress loaded from file.');
  } catch (e) { if (e.name !== 'AbortError') toast('That file doesn’t contain progress from this tracker.'); }
}
async function reconnect() { try { if ((await fileHandle.requestPermission({mode:'readwrite'})) === 'granted') { fileStatus = 'linked'; await writeFile(); render(); toast('Progress file reconnected.'); } } catch (e) {} }
let writeTimer;
function scheduleFileWrite() { if (fileStatus !== 'linked') return; clearTimeout(writeTimer); writeTimer = setTimeout(writeFile, 800); }
async function writeFile() {
  if (!fileHandle || fileStatus !== 'linked') return;
  try { const w = await fileHandle.createWritable(); await w.write(toMarkdown()); await w.close(); lastWrite = Date.now(); }
  catch (e) { fileStatus = 'needs'; if (view === 'data') render(); }
}
async function restoreHandle() {
  if (!('showSaveFilePicker' in window)) return;
  try { const h = await idbGet('handle'); if (!h) return; fileHandle = h;
    fileStatus = (await h.queryPermission({mode:'readwrite'})) === 'granted' ? 'linked' : 'needs';
    if (fileStatus === 'needs') toast('Open the Data tab to reconnect your progress file.'); } catch (e) {}
}

/* ----- clock ----- */
let lastDay = null;
function tick() {
  const t = nowTs(), d = new Date(t);
  $('#clockT').textContent = d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  $('#clockD').textContent = d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const k = keyOf(d);
  if (lastDay && k !== lastDay) { if (selKey === lastDay && BY_KEY[k]) selKey = k; render(); }
  lastDay = k;
  if (Date.now() > S.maxSeen + 60000) persist();
}

/* ----- boot ----- */
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => { view = b.dataset.v; location.hash = view === 'day' ? (selKey || '') : view; render(); });
document.addEventListener('keydown', e => {
  if (view !== 'day' || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { const i = BY_KEY[selKey].idx + (e.key === 'ArrowLeft' ? -1 : 1); if (PLAN[i]) go(PLAN[i].key); }
  if (e.key === 't') go(BY_KEY[todayKey()] ? todayKey() : START_KEY);
});
(function init() {
  const h = location.hash.slice(1);
  if (BY_KEY[h]) selKey = h; else if (['goals','log','data'].includes(h)) view = h;
  render(); tick(); setInterval(tick, 1000); restoreHandle().then(() => view === 'data' && render());
})();

</script>
